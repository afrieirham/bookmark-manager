# Deployment example for the bookmark manager.
#
#   cp .env.example .env      # then edit TOKEN
#   mkdir -p data && sudo chown -R 65532:65532 data
#   docker compose up -d
#
# The app then listens on http://localhost:8080/ (see deploy/README.md).
services:
  bookmarks:
    # Pull the published image by default. For a local build, use the
    # docker-compose.build.yml override described in README.md.
    image: ghcr.io/afrieirham/bookmark-manager:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_PATH: "/data/bookmarks.sqlite"

      # Public base URL the app builds links with. Leave unset to derive it from
      # each request (Host + X-Forwarded-Proto), which is right whenever the
      # proxy passes the real Host through; set it only when the public address
      # differs from the request Host. deploy/README.md explains it at length.
      # BASE_URL: "https://bookmarks.example.com"

      # Shared secret. Auth is ON by default, so a value is required: the app
      # exits at startup if TOKEN is empty and auth is not disabled. Set a
      # strong one in .env (copied from .env.example).
      TOKEN: "${TOKEN:?set TOKEN in .env}"

      # Auth-off flag: disables the shared secret on a fully trusted network.
      # Accepted truthy values: 1, true, yes, on. Uncomment ONLY on a trusted
      # LAN — with it set, every Bookmark is served to anyone who can reach the
      # port.
      # AUTH_DISABLED: "1"
    volumes:
      # SQLite is bind-mounted to a host path: ./data, beside this file, on the
      # machine running compose. The file is then somewhere you can back up
      # directly.
      #
      # The image runs as uid 65532, so this directory must be writable by it or
      # the app exits at startup:
      #   mkdir -p data && sudo chown -R 65532:65532 data
      #
      # A Docker-managed volume needs no chown but keeps the file where only
      # Docker can reach it — swap this line and uncomment `volumes:` below:
      #   - bookmarks-data:/data
      - ./data:/data
    healthcheck:
      # Probes /healthz, which answers 200 only while the store is readable, so
      # a restart loop or a wedged volume shows up as unhealthy rather than as
      # silent breakage. deploy/README.md has the full description.
      # $$ escapes the substitution so the container's own shell expands PORT,
      # not compose on the host: the probe must follow PORT if it is changed here.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-8080}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

# Uncomment with the named-volume alternative above.
# volumes:
#   bookmarks-data:
