# Deployment example for the bookmark manager.
#
#   cp .env.example .env      # then edit TOKEN
#   docker compose up -d
#
# The app then listens on http://localhost:8080/ (see deploy/README.md).
services:
  bookmarks:
    # The published multi-arch image (linux/amd64, linux/arm64). To build from a
    # checkout of this repo instead, comment out `image:` and uncomment `build:`.
    image: ghcr.io/afrieirham/bookmark-manager:latest
    # build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_PATH: "/data/bookmarks.sqlite"

      # Public base URL the app builds links with. Leave unset to derive it from
      # each request (Host + X-Forwarded-Proto) — the default, and correct when
      # the proxy passes the real Host through. Set it only when the proxy
      # presents a different public address than the request Host.
      # BASE_URL: "https://bookmarks.example.com"

      # Shared secret. Auth is ON by default, so a value is required: the app
      # exits at startup if TOKEN is empty and auth is not disabled. Set a
      # strong one in .env (copied from .env.example).
      TOKEN: "${TOKEN:?set TOKEN in .env}"

      # Auth-off flag: disables the shared secret on a fully trusted network.
      # Accepted truthy values: 1, true, yes, on. Uncomment ONLY on a trusted
      # LAN — with it set, every Bookmark is served to anyone who can reach the
      # port.
      # AUTH_DISABLED: "1"
    volumes:
      # A named volume holds the SQLite file and survives `docker compose down`.
      # The image runs as uid 65532 and a named volume inherits the ownership of
      # /data in the image, so this works with no chown.
      #
      # To keep the file somewhere you back up yourself, use a bind mount
      # instead — `- ./data:/data` — and make the directory writable by the
      # container's uid first: `sudo mkdir -p ./data && sudo chown -R 65532:65532 ./data`.
      - bookmarks-data:/data
    healthcheck:
      # /healthz answers 200 only when the store can be read, so a restart loop
      # or a wedged volume shows up as unhealthy rather than as silent breakage.
      # $$ escapes the substitution so the container's own shell expands PORT,
      # not compose on the host: the probe must follow PORT if it is changed here.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-8080}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  bookmarks-data:
