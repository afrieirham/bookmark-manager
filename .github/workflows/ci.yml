name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A superseded pull-request run tells you nothing, so cancel it. A push is left
# to finish: cancelling one mid-push could interrupt a multi-arch image between
# its layers and its manifest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go test ./...

  publish:
    needs: test
    # Only a push to main or a tag publishes. A pull request must never be able
    # to push an image, so this is deliberately not the default branch check:
    # `github.event_name` cannot be influenced by the branch being pushed.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # the only permission needed to push to ghcr.io

    steps:
      - uses: actions/checkout@v7

      # ghcr.io rejects an uppercase image name, and GITHUB_REPOSITORY keeps the
      # case the repository was created with — so a repo renamed to include a
      # capital would fail here with a confusing error. Fold it instead.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # No QEMU step: the Dockerfile cross-compiles for $TARGETARCH while running
      # on $BUILDPLATFORM, so both architectures are produced at native speed
      # rather than under emulation. `platforms` is what feeds it those args.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
