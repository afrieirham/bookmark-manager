# nginx server block for the bookmark manager.
#
# Drop this into the operator's existing nginx, e.g.
# /etc/nginx/conf.d/bookmarks.conf, then `nginx -t && systemctl reload nginx`.
#
# Plain HTTP, matching the app's stance that TLS is the operator's job and never
# the app's (see docs/adr/0001-host-agnostic-exposure.md). Replace the
# server_name below with your own name. Adding TLS to this block is the only
# change needed for HTTPS: nothing else here depends on the scheme.
server {
    listen 80;
    server_name bookmarks.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;

        # The real Host must reach the app: it derives its base URL from the
        # request, so links would otherwise be built against 127.0.0.1.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The app reads this to build links (and, later, to detect a trusted
        # HTTPS origin). Left as $scheme rather than a literal so that
        # terminating TLS in this block is enough: $scheme becomes https and PWA
        # install / Android sharing switch on by themselves, no app change.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
