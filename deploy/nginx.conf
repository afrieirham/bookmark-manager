# nginx server block for the bookmark manager.
#
# Drop this into the operator's existing nginx, e.g.
# /etc/nginx/conf.d/bookmarks.conf, then `nginx -t && systemctl reload nginx`.
#
# Plain HTTP on the private LAN/VPN. TLS is deliberately the operator's job,
# not the app's (see docs/adr/0001-host-agnostic-exposure.md). `bookmarks.pi`
# is reached over the Tailscale subnet route; the name resolves to the host
# running this nginx and the compose stack.
server {
    listen 80;
    server_name bookmarks.pi;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The app reads this to build links (and, later, to detect a trusted
        # HTTPS origin). With $scheme = http here, links are http://bookmarks.pi.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
